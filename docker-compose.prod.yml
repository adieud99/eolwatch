services:
  db:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eolwatch}
      POSTGRES_USER: ${POSTGRES_USER:-eolwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eolwatch}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-eolwatch}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-eolwatch}
      CORS_ORIGINS: https://${DOMAIN}
      AUTO_CREATE_SCHEMA: "false"
      CREDENTIAL_KEY: ${CREDENTIAL_KEY:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-5}
      AI_PIPELINE: ${AI_PIPELINE:-true}
      PUBLIC_BASE_URL: https://${DOMAIN}
      DEMO_TARGET_IPS: ${DEMO_TARGET_IPS:-}
      SSH_PRIVATE_KEY_PATH: /run/secrets/eolwatch_ssh_key
      SSH_KNOWN_HOSTS_PATH: /run/secrets/known_hosts
      SSH_STRICT_HOST_KEY: "true"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3); assert r.status == 200 and json.load(r)['status'] == 'ok'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./secrets:/run/secrets:ro
      - analysis_uploads:/var/lib/eolwatch/uploads
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      target: analysis-worker
    command: ["python", "-m", "app.worker"]
    environment:
      CREDENTIAL_KEY: ${CREDENTIAL_KEY:-}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-5}
      AI_PIPELINE: ${AI_PIPELINE:-true}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-eolwatch}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-eolwatch}
      AUTO_CREATE_SCHEMA: "false"
      SSH_PRIVATE_KEY_PATH: /run/secrets/eolwatch_ssh_key
      SSH_KNOWN_HOSTS_PATH: /run/secrets/known_hosts
      SSH_STRICT_HOST_KEY: "true"
      COLLECTION_HOUR: ${COLLECTION_HOUR:-8}
      COLLECTION_MINUTE: ${COLLECTION_MINUTE:-30}
      SCHEDULER_TIMEZONE: Asia/Seoul
      ANALYSIS_SYFT_PATH: /opt/analysis-tools/syft
      ANALYSIS_GRYPE_PATH: /opt/analysis-tools/grype
      ANALYSIS_ARTIFACTS_DIR: /var/lib/eolwatch/analysis
      ANALYSIS_CACHE_DIR: /var/cache/eolwatch
    volumes:
      - ./secrets:/run/secrets:ro
      - analysis_uploads:/var/lib/eolwatch/uploads
      - analysis_artifacts:/var/lib/eolwatch/analysis
      - analysis_cache:/var/cache/eolwatch
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  analysis_artifacts:
  analysis_cache:
  caddy_data:
  caddy_config:
  analysis_uploads:
