services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eolwatch
      POSTGRES_USER: eolwatch
      POSTGRES_PASSWORD: eolwatch
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eolwatch"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://eolwatch:eolwatch@db:5432/eolwatch
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
      AUTO_CREATE_SCHEMA: "false"
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-deployment}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Eolwatch!2026}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
      TEAMS_RECIPIENT_LABEL: ${TEAMS_RECIPIENT_LABEL:-EOLWatch 운영 채널}
      PUBLIC_BASE_URL: http://localhost:8080
      DEMO_TARGET_IPS: ${DEMO_TARGET_IPS:-}
      SSH_PRIVATE_KEY_PATH: /run/secrets/eolwatch_ssh_key
      SSH_KNOWN_HOSTS_PATH: /run/secrets/known_hosts
      SSH_STRICT_HOST_KEY: "true"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3); assert r.status == 200 and json.load(r)['status'] == 'ok'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./secrets:/run/secrets:ro
      - analysis_uploads:/var/lib/eolwatch/uploads
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      target: analysis-worker
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://eolwatch:eolwatch@db:5432/eolwatch
      AUTO_CREATE_SCHEMA: "false"
      SSH_PRIVATE_KEY_PATH: /run/secrets/eolwatch_ssh_key
      SSH_KNOWN_HOSTS_PATH: /run/secrets/known_hosts
      SSH_STRICT_HOST_KEY: "true"
      COLLECTION_HOUR: "8"
      COLLECTION_MINUTE: "30"
      SCHEDULER_TIMEZONE: Asia/Seoul
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
      ANALYSIS_SYFT_PATH: /opt/analysis-tools/syft
      ANALYSIS_GRYPE_PATH: /opt/analysis-tools/grype
      ANALYSIS_ARTIFACTS_DIR: /var/lib/eolwatch/analysis
      ANALYSIS_CACHE_DIR: /var/cache/eolwatch
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - ./secrets:/run/secrets:ro
      - analysis_uploads:/var/lib/eolwatch/uploads
      - analysis_artifacts:/var/lib/eolwatch/analysis
      - analysis_cache:/var/cache/eolwatch
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  analysis_artifacts:
  analysis_cache:
  analysis_uploads:
