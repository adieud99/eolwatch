# Re-resolve the api service on every request: after a Docker restart the api container gets a new
# address, and a proxy_pass with a literal hostname would keep the old one until nginx restarts (502).
server {
    listen 80;
    server_name _;
    client_max_body_size 200m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        proxy_pass $api/health;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass $api;
        proxy_read_timeout 180s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html;
    }
}
